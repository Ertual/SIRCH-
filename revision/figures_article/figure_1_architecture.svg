   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d303a" x="38.448" y="37.603751" transform="rotate(-0 38.448 37.603751)">Figure 1. SIRCH system architecture</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596771" x="38.448" y="50.723557" transform="rotate(-0 38.448 50.723557)">Seven operational modules; spatial and temporal stages share module 3</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25577a" x="49.3848" y="105.371081" transform="rotate(-0 49.3848 105.371081)">1  Acquisition</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(49.3848 123.809794)">USB / IP camera</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(49.3848 134.913614)">or video file</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #268073" x="213.4368" y="105.371081" transform="rotate(-0 213.4368 105.371081)">2  Preprocessing</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(213.4368 123.809794)">BGR to RGB; 224 x 224</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(213.4368 134.913614)">20-frame buffer</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #705e91" x="393.1128" y="93.396041" transform="rotate(-0 393.1128 93.396041)">3  Spatiotemporal model</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(393.1128 111.834754)">EfficientNet-B0 (frozen)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(393.1128 122.938574)">1280 features / frame</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(393.1128 134.042394)">LSTM 256 + sigmoid score</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b37824" x="627.4728" y="105.371081" transform="rotate(-0 627.4728 105.371081)">4  Decision</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(627.4728 123.809794)">Mean of last K scores</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(627.4728 134.913614)">Alert if mean &gt;= theta</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b34c53" x="564.9768" y="277.013321" transform="rotate(-0 564.9768 277.013321)">5  Alerts</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(564.9768 295.452034)">Sound / email / Telegram</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(564.9768 306.555854)">30 s cooldown</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #268073" x="314.9928" y="277.013321" transform="rotate(-0 314.9928 277.013321)">6  Incident log</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(314.9928 295.452034)">SQLite: time, score,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(314.9928 306.555854)">screenshot</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25577a" x="49.3848" y="277.013321" transform="rotate(-0 49.3848 277.013321)">7  Operator dashboard</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(49.3848 295.452034)">Flask: history, settings,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26343d" transform="translate(49.3848 306.555854)">CSV export</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596771" x="382.176" y="233.201072" transform="rotate(-0 382.176 233.201072)">trigger + capture</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #66727b" x="429.048" y="370.670986" transform="rotate(-0 429.048 370.670986)">configurable theta / K</text>
   </g>
  </g>
 </g>
